<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="24" height="24">
  <!-- Graviton FX app icon, concept A "well and ball" (simplified drawing, used at 24 px and below):
       two thick rings seen from above at a middle angle, the ball resting in them; no tile.
       Soft shading on the ball only, as in the full drawing. -->
  <defs>
    <radialGradient id="ball" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffb468"/>
      <stop offset="0.55" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#ec8530"/>
    </radialGradient>
  </defs>
  <ellipse cx="32" cy="35" rx="29" ry="18.5" fill="none" stroke="#ff9a3c" stroke-opacity="0.6" stroke-width="6"/>
  <ellipse cx="32" cy="39" rx="15" ry="8" fill="none" stroke="#ff9a3c" stroke-opacity="0.9" stroke-width="6"/>
  <circle cx="32" cy="21" r="13.5" fill="url(#ball)"/>
</svg>
