<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="24" height="24">
  <!-- Graviton FX app icon, concept A "well and ball" (simplified drawing, used at 24 px and below):
       two rings with the ball sitting down inside them, so it reads as a ball in a well -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#11151d" stroke="#2a3141" stroke-width="3"/>
  <ellipse cx="32" cy="40" rx="27" ry="12" fill="none" stroke="#ff9a3c" stroke-opacity="0.45" stroke-width="5"/>
  <ellipse cx="32" cy="42" rx="14" ry="6" fill="none" stroke="#ff9a3c" stroke-opacity="0.8" stroke-width="5"/>
  <circle cx="32" cy="34" r="10" fill="#ff9a3c"/>
</svg>
