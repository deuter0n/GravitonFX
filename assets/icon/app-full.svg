<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <!-- Graviton FX app icon, concept A "well and ball" (full drawing, used above 24 px).
       The tile is lighter than the app's background so its shape shows on a dark taskbar. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3446"/>
      <stop offset="1" stop-color="#171c27"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#tile)" stroke="#4a5570" stroke-width="2"/>
  <ellipse cx="32" cy="42" rx="25" ry="10.5" fill="none" stroke="#ff9a3c" stroke-opacity="0.35" stroke-width="3.2"/>
  <ellipse cx="32" cy="43.8" rx="16" ry="6.6" fill="none" stroke="#ff9a3c" stroke-opacity="0.7" stroke-width="3.2"/>
  <ellipse cx="32" cy="45.5" rx="7.8" ry="3.1" fill="none" stroke="#ff9a3c" stroke-width="3.2"/>
  <circle cx="32" cy="23" r="10" fill="#ff9a3c"/>
</svg>
